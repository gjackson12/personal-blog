<svg width="480" height="100" viewBox="0 0 480 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Network mark (centered at 50,50) -->
  <line x1="20" y1="18" x2="50" y2="42" stroke="#1D9E75" stroke-width="1.2"/>
  <line x1="80" y1="20" x2="50" y2="42" stroke="#1D9E75" stroke-width="1.2"/>
  <line x1="72" y1="74" x2="50" y2="42" stroke="#1D9E75" stroke-width="1.2"/>
  <line x1="50" y1="8" x2="50" y2="37" stroke="#9FE1CB" stroke-width="1" stroke-dasharray="3 2"/>
  <line x1="90" y1="56" x2="55" y2="43" stroke="#9FE1CB" stroke-width="1" stroke-dasharray="3 2"/>
  <line x1="20" y1="72" x2="48" y2="48" stroke="#9FE1CB" stroke-width="1" stroke-dasharray="3 2"/>
  <line x1="8" y1="40" x2="44" y2="42" stroke="#9FE1CB" stroke-width="1" stroke-dasharray="3 2"/>
  <!-- Solid nodes -->
  <circle cx="20" cy="18" r="5" fill="#1D9E75"/>
  <circle cx="80" cy="20" r="5" fill="#1D9E75"/>
  <circle cx="72" cy="74" r="5" fill="#1D9E75"/>
  <!-- Dashed nodes -->
  <circle cx="50" cy="8" r="3.5" fill="#9FE1CB"/>
  <circle cx="90" cy="56" r="3.5" fill="#9FE1CB"/>
  <circle cx="20" cy="72" r="3.5" fill="#9FE1CB"/>
  <circle cx="8" cy="40" r="3.5" fill="#9FE1CB"/>
  <!-- Center node -->
  <circle cx="50" cy="42" r="10" fill="#E1F5EE"/>
  <circle cx="50" cy="42" r="7.5" fill="#0F6E56"/>
  <!-- Divider -->
  <line x1="112" y1="20" x2="112" y2="80" stroke="#1D9E75" stroke-width="0.5" opacity="0.3"/>
  <!-- Wordmark -->
  <text x="128" y="52" text-anchor="start" font-family="'Courier New', Courier, monospace" font-size="26" font-weight="700" fill="#2D4D5F" letter-spacing="2">EVENTUAL</text>
  <text x="130" y="70" text-anchor="start" font-family="'Courier New', Courier, monospace" font-size="12" font-weight="400" fill="#1D9E75" letter-spacing="4">CONSISTENCY</text>
</svg>
